apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    app-management: grafana
spec:
  config:
    auth:
      disable_login_form: 'false'
      disable_signout_menu: 'false'
    auth.anonymous:
      enabled: 'false'
    auth.basic:
      enabled: 'true'
    log:
      level: info
      mode: console
  deployment:
    spec:
      template:
        spec:
          containers:
            - env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      key: GF_SECURITY_ADMIN_USER
                      name: grafana-admin-credentials
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: GF_SECURITY_ADMIN_PASSWORD
                      name: grafana-admin-credentials
              name: grafana
  disableDefaultAdminSecret: true
  route:
    metadata: {}
    spec:
      port:
        targetPort: 3000
      tls:
        insecureEdgeTerminationPolicy: Redirect
        termination: edge
      to:
        kind: Service
        name: grafana-service
        weight: 100
      wildcardPolicy: None